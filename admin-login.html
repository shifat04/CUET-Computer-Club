<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - CUET Computer Club</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="index.html" class="logo">
                    <img src="assert/cuet_logo.png" alt="CUET Computer Club Logo" class="logo-icon">
                    <span class="logo-text">CUET Computer Club</span>
                </a>
            </div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="admin-login.html" class="nav-link btn-login active">Admin Login</a></li>
            </ul>
        </div>
    </nav>

    <section class="login-section">
        <div class="section-container">
            <div class="login-wrapper">
                <div class="login-form-container">
                    <h2 class="form-title">Admin Login</h2>
                    <p class="form-subtitle">Sign in to manage activity cards</p>

                    <form id="adminLoginForm" class="contact-form">
                        <div class="form-group">
                            <label for="adminEmail" class="form-label">Email Address</label>
                            <input type="email" id="adminEmail" class="form-input" placeholder="admin@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="adminPassword" class="form-label">Password</label>
                            <input type="password" id="adminPassword" class="form-input" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-primary">Login as Admin</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="js/admin.js"></script>
</body>
</html>
